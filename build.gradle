plugins {
    id 'com.finpay.spring-conventions'
    id 'com.finpay.testing-conventions'
}

description = 'FinPay gateway.'

// Services are bootable applications.
bootJar {
    enabled = true
}
jar {
    enabled = true
}

dependencies {
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.data.redis
    implementation libs.spring.security.oauth2.jose
    implementation libs.common.web

    testImplementation libs.spring.boot.starter.test
    // Declared literally: the precompiled testing-conventions plugin does not
    // regenerate the catalog accessor for spring-boot-starter-test reliably.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
