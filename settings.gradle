pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'com.google.protobuf' version '0.9.4'
    }
}

rootProject.name = 'gateway'

// Consume shared libraries (com.finpay:common-*) from the platform repo as a
// composite build (source include). No Maven registry needed. See ADR-0011.
includeBuild 'finpay-platform'

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}
