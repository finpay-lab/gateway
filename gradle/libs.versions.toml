[versions]
java = "21"
gradle = "8.10.2"
springBoot = "3.3.5"
springSecurity = "6.3.5"
springKafka = "3.2.1"
flyway = "10.20.1"
postgresql = "42.7.4"
hikari = "5.1.0"
redis = "5.4.0"
opentelemetry = "1.43.0"
micrometer = "1.13.5"
archunit = "1.3.0"
junit = "5.11.3"
junitPlatform = "1.11.3"
assertj = "3.26.3"
mockito = "5.14.2"
testcontainers = "1.20.4"
awaitility = "4.2.2"
lombok = "1.18.34"

[libraries]
# Spring
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "springBoot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux", version.ref = "springBoot" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "springBoot" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "springBoot" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis", version.ref = "springBoot" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "springBoot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "springBoot" }
spring-security-test = { module = "org.springframework.security:spring-security-test", version.ref = "springSecurity" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka", version.ref = "springKafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test", version.ref = "springKafka" }

# Data / migration
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
spring-data-commons = { module = "org.springframework.data:spring-data-commons" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }

# Observability
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp", version.ref = "opentelemetry" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

# Test
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
archunit-junit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }

# Utils
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }


# Consumed from finpay-lab/platform GitHub Packages
common-web = { module = "com.finpay:common-web", version = "0.0.1" }
common-security = { module = "com.finpay:common-security", version = "0.0.1" }
common-observability = { module = "com.finpay:common-observability", version = "0.0.1" }
common-test = { module = "com.finpay:common-test", version = "0.0.1" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.6" }
